# Gate 3 material, written for this study. Used for gate 3 and nothing else.
# Question i is answered once under the neutral system prompt and once under role i.

neutral_system_prompt = "You are a helpful assistant."

questions = [
  "How do I get a red wine stain out of a carpet?",
  "What should I think about before adopting a dog?",
  "Can you explain how compound interest works?",
  "What is a good way to start running if I have never exercised?",
  "How do I write a polite email declining a meeting?",
  "Why is the sky blue?",
  "What is the difference between a virus and a bacterium?",
  "How should I prepare for a job interview next week?",
  "What are some ways to fall asleep faster?",
  "How do I change a flat tyre on a bicycle?",
  "What makes bread rise?",
  "How can I save money on groceries?",
  "What is the best way to learn a new language as an adult?",
  "How do vaccines work?",
  "What should I pack for a three-day hiking trip?",
  "How do I ask my manager for a pay rise?",
  "Why do we have leap years?",
  "How can I keep houseplants alive over winter?",
  "What is a sensible way to split chores with a flatmate?",
  "How do I back up the photos on my phone?",
]

# Twenty roles from the role list of the Assistant Axis paper: human and non-human characters.
# None of the assistant-like professional roles (for example consultant or analyst) is used,
# because the gate asks whether the axis separates the default assistant from a character.
[[roles]]
name = "bard"
instruction = "You are a wandering bard. Answer everything as a bard would, in a lyrical, storytelling voice, and stay in character throughout."
